planaware_analytics:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('DBT_HOST', '127.0.0.1') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_ENV_SECRET_PASSWORD', '') }}"
      dbname: "{{ env_var('DBT_DATABASE') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'planaware_analytics') }}"
      threads: 2
      connect_timeout: 10
      retries: 0
