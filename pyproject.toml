[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "planaware-lite"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
journey = ["psycopg[binary]>=3,<4"]
ui = ["psycopg[binary]>=3,<4", "streamlit>=1.40,<2"]

[tool.hatch.build.targets.wheel]
packages = ["planaware"]
